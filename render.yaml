services:
  - type: web
    name: aegis-ai-gateway
    env: python
    plan: free
    region: oregon
    buildCommand: pip install -e .
    startCommand: uvicorn aegis.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SIMILARITY_THRESHOLD
        value: "0.82"
      - key: EMBEDDER_TYPE
        value: "fast_local"
